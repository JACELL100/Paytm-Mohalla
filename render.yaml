# Render blueprint for the Mohalla API (free plan). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: paytm-mohalla-api
    runtime: python
    plan: free
    region: singapore            # closest free region to the Supabase project (ap-south-1, Mumbai)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL          # Supabase transaction pooler (port 6543)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHAIN_MODE
        value: sepolia
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: OPERATOR_PRIVATE_KEY  # testnet-only wallet that pays all gas
        sync: false
      - key: MERCHANT_MNEMONIC     # private mnemonic for merchant wallets (never anvil's public one)
        sync: false
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_POOL_DEADLINE_MINUTES
        value: "20"                # Sepolia needs ~2 min to mirror a reset on-chain; leave room for the pitch
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        value: https://paytm-mohalla.*\.vercel\.app
